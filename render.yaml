# Render Blueprint: New > Blueprint > pick this repo. Creates web service + Postgres + Redis (Key Value).
# Free plans are for testing: the free web service sleeps when idle and free Postgres expires after 30 days.
# Switch `plan` to starter (web, database, keyvalue) before going live.
services:
  - type: web
    name: glad-of-africa-safari
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # migrate is idempotent (CREATE IF NOT EXISTS). CMS content is seeded automatically on first use.
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: USE_DB
        value: "true"
      - key: SITE_URL
        sync: false # REQUIRED, your public https URL, e.g. https://gladofafricasafari.com (the server refuses to start otherwise)
      - key: SESSION_SECRET
        generateValue: true # signs CMS login cookies (64 random characters; never share or change it casually: it logs everyone out)
      - key: ADMIN_EMAIL
        sync: false # owner account for /admin, created on first boot
      - key: ADMIN_PASSWORD
        sync: false # REQUIRED on first boot: at least 12 characters, unique. Change it again in CMS > My profile
      - key: SMTP_URL
        sync: false # optional: e-mail alerts for new quote requests, e.g. smtps://user:pass@host
      - key: MAIL_FROM
        value: Glad Of Africa <info@gladofafricasafari.com>
      - key: DATABASE_URL
        fromDatabase:
          name: glad-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: glad-redis
          property: connectionString

  - type: keyvalue
    name: glad-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal connections only

databases:
  - name: glad-db
    plan: free
    region: frankfurt
    databaseName: glad_safari
    user: glad
